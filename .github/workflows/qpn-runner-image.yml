name: QPN runner Docker image validation
# The CUDA/runner image is an infrastructure dependency, not a per-commit
# QPN kernel test. Recheck it only when its definition changes, or on demand.
on:
  push:
    branches: ['qpn/**']
    paths:
      - 'docker/qpn-runner/**'
      - '.github/workflows/qpn-runner-image.yml'
  pull_request:
    paths:
      - 'docker/qpn-runner/**'
      - '.github/workflows/qpn-runner-image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-runner-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        env:
          QPN_GPU_UUID: GPU-00000000-0000-0000-0000-000000000000
        run: docker compose -f docker/qpn-runner/compose.yaml config --quiet
      - name: Build CUDA runner image (no GPU needed)
        run: docker build -t strata-qpn-runner:ci docker/qpn-runner
      - name: Check installed build tools and runner libraries
        run: |
          docker run --rm --entrypoint bash strata-qpn-runner:ci -lc '
            test "$(id -u)" = 10001
            nvcc --version
            cmake --version
            compute-sanitizer --version
            /opt/runner-template/bin/Runner.Listener --version
          '
