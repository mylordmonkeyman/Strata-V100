name: QPN MMQ early CPU staging first screen (one-shot V100)
on:
  push:
    branches: ['qpn/prepacked-stream']
    paths:
      - 'benchmarks/qpn/dispatch/2026-10-30-early-stage.once'
      - 'benchmarks/qpn/dispatch/2026-10-30-early-stage-phase-fix.once'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strata-qpn-v100
  cancel-in-progress: false
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate old and new A/B accounting and route publication
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p test_qpn_transition_abba.py -v
          python3 -m unittest discover -s tools -p test_qpn_early_stage_abba.py -v
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -pthread \
            tests/host/qpn_mmq_early_stage_test.cpp -o /tmp/qpn-early-stage-host
          /tmp/qpn-early-stage-host
  gpu:
    needs: [host]
    if: github.repository == 'mylordmonkeyman/Strata-V100' && github.actor == 'mylordmonkeyman'
    runs-on: [self-hosted, linux, x64, v100-sm70, strata-qpn]
    timeout-minutes: 100
    env:
      QPN_STATE_DIR: /srv/strata-qpn
      QPN_CUDA_ROOT: /usr/local/cuda-12.8
      CUDA_VISIBLE_DEVICES: '0'
      CUDA_MODULE_LOADING: EAGER
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Canonical-MMQ H2D-only vs early CPU-stage ABBA
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PATH="$QPN_CUDA_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$QPN_CUDA_ROOT/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          mkdir -p qpn-early-stage-results
          # Lock and idle test shared with previous QPN experiments.
          test -e "$QPN_STATE_DIR/gpu.lock"
          exec 9<>"$QPN_STATE_DIR/gpu.lock"
          flock -n 9
          test -x "$QPN_CUDA_ROOT/bin/nvcc"
          "$QPN_CUDA_ROOT/bin/nvcc" --version | grep -q 'release 12.8,'
          nvidia-smi -i 0 --query-gpu=compute_cap --format=csv,noheader,nounits | grep -qx '7.0'
          if nvidia-smi -i 0 --query-compute-apps=pid --format=csv,noheader,nounits |
             grep -Eq '^[[:space:]]*[0-9]+'; then
            echo 'V100 busy; refusing experiment' >&2; exit 2
          fi
          state="$QPN_STATE_DIR/full-model"
          build="$QPN_STATE_DIR/builds/qpn-full-model-opt-in"
          test -f "$state/prepared/pack/experts.bin"
          test -f "$state/prompt-2048.txt"
          test -x "$state/venv/bin/python"
          # Existing persistent CUDA/Ninja build; no Docker or package installs.
          cmake -S . -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTRATA_ENABLE_CUDA=ON -DSTRATA_EXPERIMENTAL_SM60=ON \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DCMAKE_CUDA_COMPILER="$QPN_CUDA_ROOT/bin/nvcc" \
            -DSTRATA_NATIVE_EXPERTS=ON -DSTRATA_BUILD_TESTS=OFF \
            -DSTRATA_ENABLE_VOLTA_QPN=ON -DSTRATA_QPN_PREFILL_EXPERIMENTAL=ON
          cmake --build "$build" --target strata --parallel 16
          "$state/venv/bin/python" tools/qpn_transition_abba.py \
            --early-stage-abba \
            --source "$PWD" --binary "$build/strata" \
            --prepared "$state/prepared" --state "$state" \
            --report qpn-early-stage-results
          "$state/venv/bin/python" -m json.tool qpn-early-stage-results/summary.json >/dev/null
      - name: Publish sanitized aggregate summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qpn-early-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: qpn-early-stage-results/summary.json
          if-no-files-found: warn
          retention-days: 14
