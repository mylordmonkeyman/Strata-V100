name: QPN MMQ staged and stream-all supply diagnosis
on:
  push:
    branches: ['qpn/prepacked-stream']
    paths:
      - 'src/prefill/qpn_supply_trace.hpp'
      - 'src/prefill/prefill.cpp'
      - 'src/prefill/qpn_boundary_capture.hpp'
      - 'tools/qpn_supply_profile.py'
      - 'tools/qpn_full_model_ab.py'
      - 'tools/test_qpn_supply_profile.py'
      - 'tools/qpn_layer_compare.py'
      - 'tools/test_qpn_layer_compare.py'
      - '.github/workflows/qpn-supply-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strata-qpn-v100
  cancel-in-progress: false
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s tools -p test_qpn_supply_profile.py -v
      - run: python3 -m unittest discover -s tools -p test_qpn_full_model_perf.py -v
      - name: Test private capture parsing in an isolated host environment
        run: |
          python3 -m venv "$RUNNER_TEMP/qpn-layer-venv"
          "$RUNNER_TEMP/qpn-layer-venv/bin/python" -m pip install 'numpy>=2,<3'
          "$RUNNER_TEMP/qpn-layer-venv/bin/python" -m unittest discover -s tools -p test_qpn_layer_compare.py -v
  profile:
    needs: [host]
    if: github.repository == 'mylordmonkeyman/Strata-V100' && github.actor == 'mylordmonkeyman'
    runs-on: [self-hosted, linux, x64, v100-sm70, strata-qpn]
    timeout-minutes: 100
    env:
      QPN_STATE_DIR: /srv/strata-qpn
      QPN_CUDA_ROOT: /usr/local/cuda-12.8
      CUDA_VISIBLE_DEVICES: '0'
      CUDA_MODULE_LOADING: EAGER
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Profile existing MMQ supply without changing dispatch or caches
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$QPN_CUDA_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$QPN_CUDA_ROOT/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          mkdir -p qpn-supply-results
          exec 9>"$QPN_STATE_DIR/gpu.lock"
          flock -n 9
          nvidia-smi --id=0 --query-compute-apps=pid,process_name --format=csv,noheader \
            > qpn-supply-results/processes-before.txt
          if grep -Eq '^[[:space:]]*[0-9]+,' qpn-supply-results/processes-before.txt; then
            echo 'GPU has compute clients; refusing to profile' >&2; exit 2
          fi
          model_state="$QPN_STATE_DIR/full-model"
          build="$QPN_STATE_DIR/builds/qpn-full-model-opt-in"
          cmake -S . -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTRATA_ENABLE_CUDA=ON -DSTRATA_EXPERIMENTAL_SM60=ON \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DCMAKE_CUDA_COMPILER="$QPN_CUDA_ROOT/bin/nvcc" \
            -DSTRATA_NATIVE_EXPERTS=ON -DSTRATA_BUILD_TESTS=OFF \
            -DSTRATA_ENABLE_VOLTA_QPN=ON -DSTRATA_QPN_PREFILL_EXPERIMENTAL=ON
          cmake --build "$build" --target strata --parallel 16
          "$model_state/venv/bin/python" tools/qpn_supply_profile.py \
            --source "$PWD" --binary "$build/strata" --prepared "$model_state/prepared" \
            --state "$model_state" --report qpn-supply-results --gather-chunk-repeat
      - name: Upload typed aggregate timelines and comparisons only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qpn-supply-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qpn-supply-results/summary.json
            qpn-supply-results/*-events.json
            qpn-supply-results/processes-before.txt
          if-no-files-found: warn
          retention-days: 14
