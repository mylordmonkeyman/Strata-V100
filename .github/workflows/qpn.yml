name: QPN standalone qualification tools
on:
  push:
    branches: ['qpn/**']
  pull_request:
    paths:
      - '**/*qpn*'
      - 'cmake/volta_qpn.cmake'
      - 'CMakeLists.txt'
      - '.github/workflows/qpn.yml'
      - 'docker/qpn-runner/**'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-qpn-host -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_NATIVE_EXPERTS=OFF -DSTRATA_BUILD_TESTS=ON
      - run: cmake --build build-qpn-host --target nvfp4_qpn_host_test -j2
      - run: ctest --test-dir build-qpn-host -R '^nvfp4_qpn_host$' --output-on-failure
      - run: python3 -m unittest discover -s tools -p test_qpn_audit.py -v
      - run: python3 -m unittest discover -s tools -p test_qpn_prefill.py -v
      - name: Validate opt-in MMQ route-publication and staged-tail predicates
        run: |
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -pthread \
            tests/host/qpn_mmq_early_stage_test.cpp -o /tmp/qpn-mmq-stage-host
          /tmp/qpn-mmq-stage-host
      - name: Test checkpoint fixture extraction in an isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/qpn-extract-venv"
          "$RUNNER_TEMP/qpn-extract-venv/bin/python" -m pip install 'numpy>=2,<3'
          "$RUNNER_TEMP/qpn-extract-venv/bin/python" -m unittest discover -s tools -p 'test_qpn*.py' -v
      - name: Host-only pinned ggml Q4TC quantizer parity (synthetic, no GPU)
        run: |
          cmake -S . -B build-qpn-q4tc-ggml -DSTRATA_ENABLE_CUDA=OFF \
            -DSTRATA_NATIVE_EXPERTS=ON -DSTRATA_BUILD_TESTS=ON -DSTRATA_PORTABLE=ON
          cmake --build build-qpn-q4tc-ggml --target qpn_q4tc_pinned_fixture -j2
          QPN_Q4TC_GGML_FIXTURE="$PWD/build-qpn-q4tc-ggml/qpn_q4tc_pinned_fixture" \
            python3 -m unittest discover -s tools -p test_qpn_q4tc_pinned_fixture.py -v
      - name: Reject QPN on a CPU-only backend
        run: |
          if cmake -S . -B build-qpn-reject -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_NATIVE_EXPERTS=OFF -DSTRATA_BUILD_TESTS=OFF -DSTRATA_ENABLE_VOLTA_QPN=ON; then
            exit 1
          fi
  cuda-compile:
    # GitHub-hosted Ubuntu VMs are disposable; their job containers always
    # cause 'docker pull' and reinstall dependencies. Use the already-built,
    # persistent CUDA 12.8 QPN runner instead. Compile-only: no GPU tests.
    # Never execute untrusted fork PR code on the private self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, v100-sm70, strata-qpn]
    env:
      QPN_CUDA_ROOT: /usr/local/cuda-12.8
      QPN_CI_BUILD_ROOT: /srv/strata-qpn/builds/qpn-ci-compile
      CMAKE_BUILD_PARALLEL_LEVEL: '32'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned, preinstalled CUDA build tools (no Docker or apt)
        run: |
          test -x "$QPN_CUDA_ROOT/bin/nvcc"
          "$QPN_CUDA_ROOT/bin/nvcc" --version
          cmake --version
          ninja --version
          mkdir -p "$QPN_CI_BUILD_ROOT"
      - name: Configure isolated sm_70 candidate
        run: cmake -S . -B "$QPN_CI_BUILD_ROOT/sm70" -G Ninja -DSTRATA_ENABLE_CUDA=ON -DSTRATA_EXPERIMENTAL_SM60=ON -DCMAKE_CUDA_ARCHITECTURES=70 -DCMAKE_CUDA_COMPILER="$QPN_CUDA_ROOT/bin/nvcc" -DSTRATA_NATIVE_EXPERTS=OFF -DSTRATA_BUILD_TESTS=OFF -DSTRATA_ENABLE_VOLTA_QPN=ON
      - run: cmake --build "$QPN_CI_BUILD_ROOT/sm70" --target strata_volta_qpn --parallel 32
      - name: Configure non-Volta control without QPN
        run: cmake -S . -B "$QPN_CI_BUILD_ROOT/sm80" -G Ninja -DSTRATA_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=80 -DCMAKE_CUDA_COMPILER="$QPN_CUDA_ROOT/bin/nvcc" -DSTRATA_NATIVE_EXPERTS=OFF -DSTRATA_BUILD_TESTS=OFF -DSTRATA_ENABLE_VOLTA_QPN=OFF
      - name: Reject feature on a non-Volta target
        run: |
          if cmake -S . -B "$QPN_CI_BUILD_ROOT/sm80" -DSTRATA_ENABLE_VOLTA_QPN=ON; then
            exit 1
          fi
# No GPU runner is assumed here. Runtime/sanitizer/model tests must be run on
# a V100; these jobs do not satisfy the M1/M2/M3/M4 hardware gates.
